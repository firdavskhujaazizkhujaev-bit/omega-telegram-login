<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Вход...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f1f5f9;
      color: #334155;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="status">Вход в систему...</div>

  <script>
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiXQzXONmWEyi9hKPzdfAEaBlWkqt85zIejqN0v8TA5_pdbHlmg-P6YlKz8zEvaEqF/exec';
    var statusEl = document.getElementById('status');

    if (!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initData) {
      statusEl.innerHTML = '❌ Не удалось получить данные Telegram.<br><br>' +
        '<a href="' + APPS_SCRIPT_URL + '">Открыть обычный вход по PIN</a>';
    } else {
      var tg = window.Telegram.WebApp;
      tg.ready();
      // Просто перенаправляем браузер, без fetch — так не возникает
      // проблем с CORS при кросс-доменном запросе к Apps Script.
      window.location.replace(APPS_SCRIPT_URL + '?tgInitData=' + encodeURIComponent(tg.initData));
    }
  </script>
</body>
</html>
